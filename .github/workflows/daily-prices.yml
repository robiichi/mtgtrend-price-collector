name: Daily Card Kingdom prices
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cardkingdom-prices
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '>=22.23.4 <23'
          check-latest: true
      - run: node scripts/collect.mjs
        env:
          MTGTREND_IMPORT_TOKEN: ${{ secrets.MTGTREND_IMPORT_TOKEN }}
